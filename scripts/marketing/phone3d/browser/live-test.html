<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>phone3d live test</title>
    <style>
      html, body { margin: 0; background: #ecebf1; font: 14px/1.4 system-ui, sans-serif; }
      body.dark { background: #0b0d18; color: #dfe3f0; }
      #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; z-index: 2; }
      #t { flex: 1; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="stage" style="position: relative">
      <div id="ov" style="position: absolute; left: 0; top: 0; transform-origin: 0 0; display: none; z-index: 0; padding: 10px; background: #010118"><img id="ovimg" alt="" style="display: block" /></div>
      <canvas id="c" style="position: relative; z-index: 1"></canvas>
    </div>
    <div id="bar"><input id="t" type="range" min="0" max="3000" value="0" /><span id="label">0.00 s</span></div>
    <script type="module">
      // Query: ?w=1080&h=1920&dpr=1&aa=msaa|none|ss|fxaa&env=light|dark&model=island&color=...&screen=<url>&bar=0
      import { createLivePhones } from './live.js';

      const q = new URLSearchParams(location.search);
      const W = +(q.get('w') || 1080);
      const H = +(q.get('h') || 1920);
      const env = q.get('env') || 'light';
      if (env === 'dark') document.body.classList.add('dark');
      if (q.get('bar') === '0') document.getElementById('bar').style.display = 'none';

      async function loadScreen() {
        const url = q.get('screen');
        if (url) {
          const img = new Image();
          img.src = url;
          await img.decode();
          return img;
        }
        // fallback: a simple generated screen (1320x2868)
        const c = document.createElement('canvas');
        c.width = 1320; c.height = 2868;
        const g = c.getContext('2d');
        const gr = g.createLinearGradient(0, 0, 0, 2868);
        gr.addColorStop(0, '#2d5bff'); gr.addColorStop(0.45, '#eef1ff'); gr.addColorStop(1, '#ffffff');
        g.fillStyle = gr; g.fillRect(0, 0, 1320, 2868);
        g.fillStyle = '#fff'; g.font = '600 56px system-ui'; g.fillText('9:41', 170, 110);
        g.fillStyle = '#10131c'; g.font = '700 120px system-ui'; g.fillText('Live mode', 110, 900);
        for (let i = 0; i < 5; i++) { g.fillStyle = i % 2 ? '#dfe5ff' : '#c9d4ff'; g.beginPath(); g.roundRect(110, 1100 + i * 300, 1100, 240, 48); g.fill(); }
        return c;
      }

      const live = await createLivePhones({
        canvas: document.getElementById('c'),
        width: W,
        height: H,
        dpr: +(q.get('dpr') || 1),
        env,
        aa: q.get('aa') || 'msaa',
        supersample: +(q.get('ss') || 1.5),
      });
      const phone = live.add({ model: q.get('model') || 'island', color: q.get('color') || undefined });
      const screenSrc = await loadScreen();
      // ?overlay=1: HTML-overlay mode. The screen is an <img> UNDER the canvas, mapped with
      // phone.screenCss(); the phone draws its display as 'clear' (only the glass reflection),
      // so the black border, cut-out and sheen sit on top of the HTML screen.
      const overlay = q.get('overlay') === '1';
      const ov = document.getElementById('ov');
      const BLEED = 10; // px of padding (screen edge colour) that tucks under the black border
      const ovimg = document.getElementById('ovimg');
      if (overlay) {
        phone.setScreen('clear');
        ovimg.src = screenSrc.src || screenSrc.toDataURL();
        await ovimg.decode();
        ovimg.style.width = `${ovimg.naturalWidth}px`;
        ovimg.style.height = `${ovimg.naturalHeight}px`;
        ov.style.clipPath = phone.screenClip(ovimg.naturalWidth, ovimg.naturalHeight, BLEED);
        ov.style.display = 'block';
      } else {
        phone.setScreen(screenSrc);
      }

      // one full turn of the "hero" move over 3 s: yaw sweeps, slight pitch and roll
      const ease = (x) => 0.5 - 0.5 * Math.cos(Math.PI * x);
      function stateAt(t) {
        const u = Math.min(1, Math.max(0, t / 3));
        const e = ease(u);
        return {
          cx: W / 2,
          cy: H / 2,
          height: H * 0.78,
          fov: 26,
          rotation: { x: -6 - 10 * Math.sin(Math.PI * u), y: -38 + 76 * e, z: 6 - 12 * e },
        };
      }
      function setTime(t) {
        phone.set(stateAt(t));
        live.render();
        if (overlay) ov.style.transform = phone.screenCss(ovimg.naturalWidth, ovimg.naturalHeight, BLEED);
        document.getElementById('t').value = String(Math.round(t * 1000));
        document.getElementById('label').textContent = `${t.toFixed(2)} s`;
        return phone.screenQuad();
      }
      document.getElementById('t').addEventListener('input', (e) => setTime(+e.target.value / 1000));
      window.__live = { live, phone, setTime, stateAt };
      setTime(0);
      window.__liveReady = true;
    </script>
  </body>
</html>
