apply plugin: 'com.android.application'

/*
 * Release signing, supplied from outside the repository.
 *
 * A release build has to be signed with the upload key the owner registered
 * with Play, and that key must never be in git. So this reads
 * `apps/web/android/keystore.properties`, which `.gitignore` refuses to track,
 * and only wires a release signing config when that file is actually present.
 *
 * The shape of the file, four lines:
 *
 *     storeFile=upload-keystore.jks
 *     storePassword=...
 *     keyAlias=upload
 *     keyPassword=...
 *
 * When the file is absent, `assembleRelease` still runs and produces an
 * UNSIGNED artefact rather than falling back to the debug key. That is the
 * behaviour we want. Android Gradle only auto-signs the debug build type, and a
 * release accidentally signed with the debug key is both a Play rejection and,
 * if it ever escaped, an application anybody can forge an update for. An
 * unsigned output fails loudly at upload instead, which is the honest failure.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.vallospaces.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vallospaces.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * DO NOT EDIT THESE TWO LINES BY HAND.
         *
         * `scripts/sync-native-versions.mjs` writes both of them from
         * `apps/web/package.json`, which is the one place a version is chosen
         * for this platform, and it writes the matching pair into the Xcode
         * project in the same run. Three numbers maintained in three files
         * drift, and the way that drift is discovered is a Play upload
         * rejected for a `versionCode` that did not move, hours after the
         * build that was supposed to ship.
         *
         * Run `npm run sync:versions` from the repository root before every
         * release build, and `npm run sync:versions -- --check` in CI to fail
         * a build whose native versions no longer match the manifest.
         */
        versionCode 10000000
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }

            /*
             * Written out rather than left to the default, because this is the
             * flag that ends careers. Play refuses a debuggable release upload,
             * and one that slipped through would leave the WebView open to
             * remote inspection on a shipped handset, which on this product
             * means somebody else's session and somebody else's wallet.
             * `capacitor.config.ts` sets `webContentsDebuggingEnabled: false`
             * for the same reason at the other layer.
             */
            debuggable false

            /*
             * R8 was off, which is the template default and means the release
             * ships every unused class in every dependency with its original
             * names. Capacitor is safe to shrink: `@capacitor/android` declares
             * `consumerProguardFiles` and those rules already keep everything
             * the bridge reaches reflectively, which is the plugin classes,
             * their `@PluginMethod` members and the Cordova compatibility
             * surface. `proguard-rules.pro` beside this file adds the ones that
             * belong to this application rather than to the library.
             *
             * `shrinkResources` stays OFF and that is a deliberate exception
             * rather than an oversight. `capacitor.config.ts` sets
             * `androidSplashResourceName: "splash"`, and the splash plugin
             * turns that string into a drawable at runtime through
             * `Resources.getIdentifier`. Resource shrinking works from static
             * references, cannot see a lookup by name, and would strip the
             * splash art as unused. The failure would be a black first frame on
             * a release build only, which is precisely the kind of defect that
             * survives every debug test and greets the first reviewer.
             */
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    // WebAuthn in the web view (MainActivity): Face Unlock and fingerprint for the passcode and the money lock.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/*
 * FIREBASE CLOUD MESSAGING, AND A BUILD THAT REFUSES RATHER THAN SHIPS BROKEN.
 *
 * THE BLOCK THIS REPLACES was Capacitor's default, and it was a blind light:
 * a missing or unreadable google-services.json was swallowed and reported with
 * `logger.info`, which nobody sees, and the build then SUCCEEDED and produced
 * an APK in which push notifications could never work. A release published
 * that way looks identical to a working one until a person waits for a
 * notification that is never coming.
 *
 * So the rule here is: a DEBUG build may go without push, loudly; a RELEASE
 * build may not go without it at all. A developer building locally does not
 * need Firebase. A binary going to Play does.
 *
 * WHAT IS CHECKED, and each of these has been wrong somewhere before:
 *   1. the file exists and parses,
 *   2. its package_name equals this module's applicationId, because a
 *      google-services.json from another project or another package parses
 *      perfectly and registers nothing,
 *   3. its api_key is a real key rather than the placeholder this repository
 *      ships. The key is not a secret (it travels inside every APK and is
 *      bound to the package name and the signing certificate), but it was
 *      redacted in transit when it was sent, so the file here carries a
 *      placeholder and this check is what stops that placeholder shipping.
 */
def googleServicesFile = file('google-services.json')
def fcmProblem = null
def fcmJson = null

if (!googleServicesFile.exists()) {
    fcmProblem = "apps/web/android/app/google-services.json is missing. Download it from the Firebase console, project vallo-44059, Project settings, Your apps, Android."
} else {
    try {
        fcmJson = new groovy.json.JsonSlurper().parse(googleServicesFile)
    } catch (Exception e) {
        fcmProblem = "apps/web/android/app/google-services.json does not parse as JSON: ${e.message}"
    }
}

if (fcmProblem == null) {
    def declaredPackage = fcmJson?.client?.getAt(0)?.client_info?.android_client_info?.package_name
    if (declaredPackage != "com.vallospaces.app") {
        fcmProblem = "google-services.json is for package '${declaredPackage}', but this module builds com.vallospaces.app. A file from the wrong project parses perfectly and registers nothing."
    }
}

if (fcmProblem == null) {
    def key = fcmJson?.client?.getAt(0)?.api_key?.getAt(0)?.current_key
    if (key == null || key.toString().startsWith("PASTE_")) {
        fcmProblem = "google-services.json still carries the placeholder API key. Replace 'current_key' with the Android API key from the Firebase console, project vallo-44059. It is not a secret and it belongs in this repository."
    }
}

if (fcmProblem == null) {
    apply plugin: 'com.google.gms.google-services'
} else {
    /* A release build is a shipped defect, so it stops here. A debug build
       carries on without push, but says so at error level rather than info,
       because the whole point is that somebody reads it. */
    gradle.taskGraph.whenReady { graph ->
        def releasing = graph.allTasks.any { it.name.toLowerCase().contains('release') }
        if (releasing) {
            throw new GradleException("PUSH NOTIFICATIONS WOULD NOT WORK IN THIS RELEASE BUILD. " + fcmProblem)
        }
    }
    logger.error("WARNING: push notifications are not wired in this build. " + fcmProblem)
}
