<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#010118" />
    <title>Vallo</title>
    <!--
      The shell the binary carries.

      Capacitor packages this folder into the application, and the live origin
      is loaded over it at launch. This page is what a person sees only when
      that origin cannot be reached AND the app has nothing of its own to show
      yet: the very first launch with no signal, before Vallo has ever loaded
      on this phone. Every launch after that, the web app's service worker
      (`public/sw.js`) answers from the phone: the screens the member opened
      open again offline, with a quiet line at the top saying so, and this
      page is never reached. On iOS that needs App-Bound Domains, which
      `Info.plist` and `capacitor.config.ts` now declare.

      REDRAWN 8 OCTOBER 2026, AFTER THE FOUNDER SAW IT ON TESTFLIGHT. The old
      card was a full-screen wall that said nothing could open, under a
      placeholder drawing of five towers that was never the brand. This one is
      calm and small: the real Vallo mark (`vallo-mark.svg`, written into this
      folder by `scripts/build-brand-logo.mjs`, the same artwork in the same
      colours on every ground, D82), one line that says what is happening, one
      button, and it keeps trying by itself so the person does not have to.

      It is still one page with no network request of any kind beyond the
      retry probe. The mark is a file in the binary, not a fetch. There is no
      font file, so it paints instantly with the radio switched off.

      The values are literals because this file cannot import the token sheet;
      each comment says which token it is copied from. No em dashes, British
      spelling, brand blue only, and every state designed rather than left to
      a browser default.
    -->
    <style>
      :root {
        /* The ground, from `--nf-canvas` / `--nf-surface-0`. */
        --ground: #000612;
        --ground-deep: #00030a;
        /* The one blue family, from the brand ramp. */
        --brand: #0257fd;
        --brand-lift: #2f7dff;
        --brand-edge: rgba(2, 87, 253, 0.42);
        --glow: rgba(2, 87, 253, 0.28);
        /* The Island's navy glass (`--nf-tier-island-fill`). */
        --island: rgba(4, 10, 31, 0.78);
        --text: rgba(255, 255, 255, 0.94);
        --muted: rgba(255, 255, 255, 0.64);
        --faint: rgba(255, 255, 255, 0.5);
        --on-brand: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        position: relative;
        background: var(--ground);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
        line-height: 1.5;
        display: flex;
        align-items: center;
        justify-content: center;
        /* The notch and the home indicator. `viewport-fit=cover` above is what
           makes these resolve to anything other than zero. */
        padding: calc(env(safe-area-inset-top, 0px) + 1.5rem) 1rem
          calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
        min-height: 100dvh;
        overflow-x: hidden;
      }

      /* The ground: two soft blue lights in the navy, painted once. */
      .aurora {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(72% 48% at 50% -6%, rgba(2, 87, 253, 0.2) 0%, transparent 72%),
          linear-gradient(180deg, var(--ground) 0%, var(--ground-deep) 100%);
      }

      main {
        position: relative;
        width: 100%;
        max-width: 21rem;
      }

      /* The one container: navy glass with the brand's light on its edge. */
      .island {
        position: relative;
        padding: 1.75rem 1.25rem 1.25rem;
        text-align: center;
        border: 1px solid var(--brand-edge);
        border-radius: 1.75rem;
        background: var(--island);
        box-shadow: 0 20px 48px rgba(0, 4, 16, 0.5);
        animation: rise 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* The real mark, never recoloured. */
      .mark {
        display: block;
        width: 2.75rem;
        height: auto;
        margin: 0 auto 1rem;
      }

      h1 {
        margin: 0 0 0.375rem;
        font-size: 1.25rem;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 0;
        font-size: 0.875rem;
        color: var(--muted);
      }

      /* A ROUNDED RECTANGLE, NEVER A CAPSULE: 0.875rem on a 2.75rem box. */
      button {
        margin-top: 1.25rem;
        width: 100%;
        min-height: 2.75rem;
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--brand-edge);
        border-radius: 0.875rem;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: 0 6px 18px var(--glow);
        transition: transform 120ms ease-out;
      }

      button:active {
        transform: scale(0.985);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      button:focus-visible {
        outline: 2px solid var(--brand-lift);
        outline-offset: 3px;
      }

      .status {
        margin: 0.75rem 0 0;
        min-height: 1.1rem;
        font-size: 0.75rem;
        color: var(--faint);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translate3d(0, 12px, 0);
        }
      }

      /* Motion is physics and reduced motion turns all of it off. */
      @media (prefers-reduced-motion: reduce) {
        .island {
          animation: none;
        }
        button {
          transition: none;
        }
        button:active {
          transform: none;
        }
      }

      /* Shown only when the build carries no origin at all, which is a
         packaging fault rather than a network one and needs different words. */
      #unconfigured {
        display: none;
      }
      body[data-state="unconfigured"] #offline {
        display: none;
      }
      body[data-state="unconfigured"] #unconfigured {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>

    <main>
      <div class="island" role="status" aria-live="polite">
        <!-- THE Vallo mark, the same file the web app draws, packaged here. -->
        <img class="mark" src="vallo-mark.svg" alt="" width="44" height="38" />

        <div id="offline">
          <h1>Waiting for a connection</h1>
          <p class="lede">Vallo opens as soon as your phone finds a signal.</p>

          <button type="button" id="retry">Try again</button>
          <p class="status"><span id="still" hidden>Still no signal. We keep trying by ourselves.</span></p>
        </div>

        <!--
          Shown only by a build that was packaged without `shell-config.js`
          (see `scripts/write-shell-config.mjs`), which a release build cannot
          be: the file is committed with the production origin. The words are
          for whoever is holding the phone, so they say what they can do.
        -->
        <div id="unconfigured">
          <h1>This copy of Vallo needs updating</h1>
          <p class="lede">
            Install the latest version from your app store, or open vallospaces.com in your browser.
          </p>
        </div>
      </div>
    </main>

    <!-- Written at sync time by `scripts/write-shell-config.mjs`: the live
         origin and the path the app opens on. Packaged, never fetched. -->
    <script src="shell-config.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
