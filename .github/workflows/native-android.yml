# Native Android: the first real compile of the app (28 September 2026).
#
# The Claude sandbox cannot build Android at all (its network policy blocks
# dl.google.com, so neither the SDK nor the Android Gradle Plugin can be
# fetched). GitHub's ubuntu runners ship the Android SDK and reach Google's
# Maven, so this job is the first place the Android project is ever compiled.
#
# WHAT IT BUILDS: a DEBUG APK (`assembleDebug`). It needs no secret and no
# founder value:
#   - `cap:sync:dev` is used, not `cap:sync`, because the release sync refuses
#     while the association files carry placeholders (DOC-13). The dev sync
#     prints the same warnings and carries on. The ORIGIN is still production.
#   - `app/build.gradle` refuses only RELEASE builds while
#     `google-services.json` holds the placeholder API key; a debug build logs
#     the error and builds without Firebase. The APK then installs and runs,
#     and turning notifications on reports a failure instead of crashing (the
#     bridge catches the plugin's FirebaseApp exception).
#
# WHAT IT DOES NOT PROVE: that R8 and the release signing config produce a
# working bundle (`bundleRelease`), which needs the upload keystore and the
# Firebase key. The signed release job belongs here once those exist, reading
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD from encrypted Actions secrets; see
# docs/NATIVE_CI.md. Nothing secret is, or will be, in this repository.
#
# FIRST COMPILE: run 36500914409 (29 September 2026) built the first APK.
# The APK's size and SHA-256 are printed in the "Describe the APK" step of
# every run.
name: Native Android

on:
  push:
    branches: [main]
    paths:
      - "apps/web/android/**"
      - "apps/web/capacitor.config.ts"
      - "apps/web/native-shell/**"
      - "apps/web/package.json"
      - "apps/web/scripts/write-shell-config.mjs"
      - "apps/web/scripts/check-deep-links.mjs"
      - "package-lock.json"
      - "scripts/sync-native-versions.mjs"
      - ".github/workflows/native-android.yml"
  pull_request:
    branches: [main]
    # The same list as push: a pull request that changes the sync scripts
    # changes what this build does.
    paths:
      - "apps/web/android/**"
      - "apps/web/capacitor.config.ts"
      - "apps/web/native-shell/**"
      - "apps/web/package.json"
      - "apps/web/scripts/write-shell-config.mjs"
      - "apps/web/scripts/check-deep-links.mjs"
      - "package-lock.json"
      - "scripts/sync-native-versions.mjs"
      - ".github/workflows/native-android.yml"
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  debug:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The production origin, the same value every release sync uses. Not a
      # secret: it is the public website.
      CAPACITOR_SERVER_URL: https://www.vallospaces.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Capacitor 8's android library compiles with Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Native versions match package.json
        run: npm run sync:versions -- --check

      - name: Capacitor sync (production origin, dev gate)
        run: npm run cap:sync:dev --workspace @vallo/web

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # A failed build keeps Gradle's own reports, so the reason is on the run
      # page rather than only in a truncated log.
      - name: Keep the Gradle reports when the build fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-gradle-reports-${{ github.sha }}
          path: |
            apps/web/android/build/reports
            apps/web/android/app/build/reports
          retention-days: 14
          if-no-files-found: ignore

      - name: Describe the APK
        if: ${{ success() }}
        run: |
          apk=apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          size=$(du -h "$apk" | cut -f1)
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          # In the log as well as the summary: the API exposes job logs but
          # not step summaries, and this is the line people quote.
          echo "APK $(stat -c %s "$apk") bytes (${size}), sha256 ${sum}, commit ${GITHUB_SHA}"
          {
            echo "## Android debug build compiled"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| APK | \`app-debug.apk\`, ${size} |"
            echo "| SHA-256 | \`${sum}\` |"
            echo "| Origin | ${CAPACITOR_SERVER_URL} |"
            echo ""
            echo "Debug-signed, for testing on a handset only (\`adb install app-debug.apk\`). Push is inactive until the Firebase Android key is in google-services.json. Not uploadable to Play."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: vallo-android-debug-${{ github.sha }}
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # C15 (30 September 2026): the first time the APK meets a phone, even an
  # emulated one. Installs the debug APK from the job above on an Android 14
  # emulator and runs the P0 rows of docs/VALLO_NATIVE_TEST_MATRIX.md that
  # need no account: cold launch online (row 1), a deep link to /open, the
  # back button at the root (row 23), and a cold launch with the network off
  # (row 2). A screenshot of each is kept under Artifacts; the pass or fail is
  # a person looking at them, because a web view's content is not readable to
  # adb. `continue-on-error` so an emulator that fails to boot never blocks a
  # build that compiled.
  emulator:
    name: Android emulator smoke (no account)
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vallo-android-debug-${{ github.sha }}
          path: apk

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the no-account P0 rows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p shots
            adb install -r apk/app-debug.apk
            adb shell monkey -p com.vallospaces.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > shots/01-cold-launch-online.png
            adb shell am start -W -a android.intent.action.VIEW -d "https://www.vallospaces.com/open" com.vallospaces.app || true
            sleep 12
            adb exec-out screencap -p > shots/02-deep-link-open.png
            adb shell input keyevent 4
            sleep 4
            adb exec-out screencap -p > shots/03-back-at-root.png
            adb shell am force-stop com.vallospaces.app
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell monkey -p com.vallospaces.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > shots/04-cold-launch-offline.png
            adb shell svc wifi enable
            adb shell svc data enable
            adb logcat -d -s Capacitor:* chromium:* AndroidRuntime:E > shots/logcat.txt || true

      - name: Keep the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-emulator-smoke-${{ github.sha }}
          path: shots
          retention-days: 14
          if-no-files-found: warn
