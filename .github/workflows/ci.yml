# CI on push (A2-141, T-1). Nothing ran automatically before this file.
#
# Three checks that need no secrets: typecheck, lint, test. They run from the
# repository root so the workspaces resolve, on the Node line the app is
# developed on, with the npm cache keyed on package-lock.json. `npm run lint`
# is `eslint . && node scripts/check-css-tokens.mjs && node
# scripts/check-valuation-words.mjs` in apps/web, so the CSS token check and
# the valuation-words check ride in with it.
#
# The build is a separate job because it is the slow one and the one most
# likely to need an environment later. Today `next build` passes without any
# env, so it runs here with none; if it
# ever needs a key, it gets a repository variable, never a secret in this file.
#
# IT NO LONGER WAITS FOR `checks`, AND THAT IS THE POINT OF THIS EDIT.
# `next build` is the ONLY gate that sees a type re-export from a "use server"
# module: TypeScript erases it, no test can reach it, and the CSS checker has
# nothing to say about it. That line took production down for twenty minutes
# on 19 September 2026. With `needs: checks` the
# build was skipped entirely whenever a typecheck, a lint warning-turned-error
# or one red test failed for an unrelated reason, which is exactly the shape of
# the day that outage happened: the one gate that could see it did not run.
# The two jobs are independent now, so a push always gets the build's answer.
# The cost is one extra runner on a red branch, which is worth far less than
# twenty minutes of production.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # All three run on every push, not just up to the first red one. A run
      # that stops at the typecheck tells a developer one thing about their branch
      # and hides two, which costs a round trip each time; the job still fails
      # if any of them does. `!cancelled()` rather than `always()`, so a
      # cancelled run stops properly.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

      # DOC-13 / STORE-03. Red, with one error annotation per placeholder,
      # until the founder's Apple Team ID and Play signing fingerprints are in
      # the association files. `continue-on-error` keeps it from blocking web
      # work; `npm run cap:sync` (the documented release sync) runs the same
      # check strictly, so a release sync refuses while it is red; a bare
      # `npx cap sync` is not guarded. Drop `continue-on-error` the day
      # the values land.
      - name: Deep links (founder values)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run check:deep-links --workspace @vallo/web

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
