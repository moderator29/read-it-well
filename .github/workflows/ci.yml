# CI on push (A2-141, T-1). Nothing ran automatically before this file.
#
# Three checks that need no secrets: typecheck, lint, test. They run from the
# repository root so the workspaces resolve, on the Node line the app is
# developed on, with the npm cache keyed on package-lock.json. `npm run lint`
# is `eslint . && node scripts/check-css-tokens.mjs && node
# scripts/check-valuation-words.mjs` in apps/web, so the CSS token check and
# the valuation-words check ride in with it.
#
# `npm ci`, never `npm install`: production (Vercel) builds from
# package-lock.json, so the lockfile tree is the only tree worth testing
# (DOC-01, DOC-02). A separate, non-required `audit` job fails on a high or
# critical advisory in the production dependencies, so a vulnerable pin cannot
# sit in the lock unseen without an advisory service outage blocking a merge.
#
# THE BUILD COMPILES PRODUCTION'S CONFIG (DOC-P2-02). `next.config.ts` and
# several `NEXT_PUBLIC_*` branches fold at build time, so a build with no env
# compiles a program that never ships. The Build job therefore gets the same
# PUBLIC values Vercel has: the Supabase project URL and publishable key, the
# site URL and the MapTiler key. None of them is a secret (all four are in the
# browser bundle), and they come from repository VARIABLES (Settings, Secrets
# and variables, Actions, Variables), never secrets, except the two addresses,
# which fall back to their known values. A missing variable is a loud warning
# in the run, not a silent no-env build.
#
# IT NO LONGER WAITS FOR `checks`, AND THAT IS THE POINT OF THIS EDIT.
# A type re-export from a "use server" module took production down for twenty
# minutes on 19 September 2026. TypeScript erases it and no unit test reaches
# it; two gates see it: lint (`nf/server-actions-export-only-actions`) and
# `next build` (DOC-P2-01). With `needs: checks` the build was skipped
# entirely whenever a typecheck, lint or one red test failed for an unrelated
# reason, which is exactly the shape of the day that outage happened. The two
# jobs are independent now, so a push always gets the build's answer. The cost
# is one extra runner on a red branch, which is worth far less than twenty
# minutes of production.
#
# THE DATABASE PROBES (DOC-03) are the `db-probes` job: every
# supabase/tests/probes/*.sql against the database in the PROBES_DATABASE_URL
# secret, each required to raise PROBE_OK (and always rolled back). The unit
# suite never reaches the database; this is the job that fails when a
# migration revokes a grant an RLS policy needs.
#
# WHAT IS STILL MISSING FROM THIS REPOSITORY, AND WHAT EACH MISSING VALUE TURNS
# ON. All four are added in Settings, Secrets and variables, Actions. Nothing
# below is a placeholder for a value that exists: every one of them is absent
# today, which is why the jobs that need them say they measured less than they
# look like they measured.
#
#   SECRET  QA_MEMBER_EMAIL and QA_MEMBER_PASSWORD, one real signed-in member.
#     Together with the anon key they turn the `desks-a11y` job from a scan of
#     the fixture harness into a scan of the REAL host and agent desks
#     (`tests/a11y-desks.spec.mjs`, `tests/host.spec.mjs`). Neither spec can
#     sign in without both, and signing in cannot reach the platform without
#     the anon key, so the credentials alone unlock nothing.
#     They are also what a `WEIGHT_COOKIE` would be minted from, which is the
#     one thing blocking the seven signed-in weight budgets: they are null in
#     `perf-budget.json` because `scripts/check-weight.mjs` skips a signed-in
#     route with no cookie, and the credential-free stub serves no data, so a
#     measurement taken through it is the weight of an empty page.
#   VARIABLE  NEXT_PUBLIC_SUPABASE_ANON_KEY. Public, not a secret. Without it
#     every build here compiles the unconfigured branches, so nothing inside
#     the platform loads and no signed-in page can be measured or scanned.
#   VARIABLE  NEXT_PUBLIC_MAPTILER_KEY. Public, not a secret. Without it the
#     map surfaces render their no-key state, so their weight and their
#     accessibility are not the shipped ones.
#
name: CI

on:
  # `main` ONLY, plus pull requests and by hand.
  #
  # On 6 October this briefly also carried `claude/vallo-**`, because a push to
  # a session branch matched no trigger at all and D37's "green CI before every
  # push" was unachievable as written (D42). It did its job: it got the
  # `source-map-js` lockfile fix onto a clean runner, which is the only thing
  # that proves a lockfile, since `npm audit` and the local suite both read an
  # already-populated `node_modules`.
  #
  # IT IS GONE AGAIN BECAUSE DRAFT PULL REQUESTS NOW EXIST for all three
  # session branches (83, 84, 85), and `pull_request` already fires on every
  # push to a branch with an open PR. With both triggers live, ONE PUSH STARTED
  # TWO FULL SUITES: commit c2a8a5f produced run 867 (`push`, success) and run
  # 868 (`pull_request`, cancelled) on the same sha. Two `Build`, two
  # `Typecheck, lint, test`, two `Database probes`. That is double the minutes
  # and, worse, double the eviction pressure on the single `db-probes` slot that
  # D47 is about.
  #
  # So: a session branch is covered by its pull request. If a branch ever needs
  # a verdict without one, use `workflow_dispatch` rather than bringing the
  # branch trigger back.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand (Actions, CI, Run workflow): re-check the whole accumulated state
  # of a branch without a new commit. Added 29 September 2026, after CI
  # started no job at all for days and nothing on main was ever validated.
  workflow_dispatch:

# DOC-23: a pull request cancels its own superseded runs; a push to main never
# does, so every commit on main gets its verdict and a regression can be
# bisected to the commit that brought it.
#
# WHAT `cancel-in-progress: false` ACTUALLY DOES, since this was got wrong once
# on 6 October and the mistake cost a real check: it protects the run that is
# ALREADY EXECUTING. It does not make GitHub hold a line of waiting runs.
# GitHub keeps only the MOST RECENT PENDING run in a group and cancels the
# others, so superseded runs do not queue, they disappear. Writing "they queue
# behind each other" in this file led to a trade being accepted that bought
# nothing (D47.1). The per-commit guarantee above comes from the group key
# including `github.sha`, not from `cancel-in-progress`.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    # The suite passed 10,900 tests (unit plus Chromium dom tests with axe) and
    # was still green when the 20-minute limit cancelled it on 6 October; the
    # budget covers the whole suite with room, so a passing run is never cut.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration check diffs against the commit before this push.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # All of these run on every push, not just up to the first red one. A
      # run that stops at the typecheck tells a developer one thing about their
      # branch and hides the rest, which costs a round trip each time; the job
      # still fails if any of them does. `!cancelled()` rather than
      # `always()`, so a cancelled run stops properly.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # DOC-P2-04: failures are recorded by name, and kept.
      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test --workspace @vallo/web -- --reporter=default --reporter=junit --outputFile.junit=vitest-junit.xml

      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-junit
          path: apps/web/vitest-junit.xml
          if-no-files-found: warn

      # DOC-13 / STORE-03. Red, with one error annotation per placeholder,
      # until the founder's Apple Team ID and Play signing fingerprints are in
      # the association files. `continue-on-error` keeps it from blocking web
      # work; `npm run cap:sync` (the documented release sync) runs the same
      # check strictly, so a release sync refuses while it is red; a bare
      # `npx cap sync` is not guarded. Drop `continue-on-error` the day
      # the values land.
      - name: Deep links (founder values)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run check:deep-links --workspace @vallo/web

      - name: Database probe files keep the contract
        if: ${{ !cancelled() }}
        run: node scripts/db-probes/run.mjs --check

      # The authoring tool in scripts/marketing stays out of the product. See
      # the `audit` job below for why it is excluded from the production
      # advisories tree and what makes that exclusion safe; this is the half
      # that goes red if it stops being true. Needs no network and no install.
      - name: The marketing tool stays a tool
        if: ${{ !cancelled() }}
        run: node scripts/check-marketing-deps.mjs

      # OPS-08: migration names and versions, and no applied migration edited,
      # renamed or deleted since the commit before this push (or the pull
      # request's base).
      - name: Migrations are named, unique and never edited
        if: ${{ !cancelled() }}
        run: node scripts/check-migrations.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      # The online half: supabase/migrations/APPLIED.txt against the live
      # supabase_migrations.schema_migrations, both ways. Runs only when one of
      # the two secrets is set (a read-only connection string, or a Management
      # API token; `secrets` cannot be read in an `if:`, so the script decides);
      # without either it says it skipped and passes, so
      # the offline half above (also run by `npm run lint`) stays the gate.
      - name: Migrations match the live history
        if: ${{ !cancelled() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client); fi
          node scripts/check-migrations.mjs --online

  # Its own job, and NOT one of the required checks: a new advisory with no
  # fix yet, or the npm audit service being down, must not turn the
  # deterministic gate above red. A red run here is a notice to act on.
  audit:
    name: Advisories (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      # SCRIPTS/MARKETING IS AUDITED HERE AND IS DELIBERATELY NOT IN THE TREE
      # ABOVE. It landed on main with its own package-lock.json and nothing
      # looked at it. What it is: an authoring tool, run by hand, that draws
      # App Store and Play screenshots, the social posts and the launch video
      # from the live product (scripts/marketing/DESIGN.md). Its ten
      # dependencies are Three.js, GSAP, a 3D emoji set, two icon sets, three
      # webfont packages and two map atlases, all of them used to produce an
      # image on somebody's laptop. Nothing it installs is imported by the
      # application and nothing it installs reaches a visitor: the finished
      # files do.
      #
      # It is therefore NOT one of the root `workspaces` globs (`apps/*`,
      # `packages/*`), so `npm ci` never installs it, no job has it on disk,
      # and the root `npm audit --omit=dev` above cannot see it. That is the
      # right exclusion and not an oversight: adding it to the workspaces to
      # get it audited would put a 3D engine into the tree every production
      # build resolves from, in order to gate code that never runs on a server.
      #
      # So its advisories are checked from its committed lockfile instead.
      # `--package-lock-only` installs nothing, which is what keeps this one
      # step rather than a job. `--prefix` makes npm read that folder's
      # manifest and lockfile. It rides in this non-required job on purpose,
      # for the same reason the step above does: a new advisory with no fix
      # must not block a merge, and a screenshot tool's advisory least of all.
      - name: npm audit (scripts/marketing, the authoring tool)
        if: ${{ !cancelled() }}
        run: npm audit --package-lock-only --audit-level=high --prefix scripts/marketing

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://uccixoonmbhrnyczyigt.supabase.co' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.vallospaces.com' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MAPTILER_KEY: ${{ vars.NEXT_PUBLIC_MAPTILER_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Say which production values this build is missing
        run: |
          for v in NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_MAPTILER_KEY; do
            if [ -z "${!v}" ]; then
              echo "::warning title=Build is not production-shaped::Repository variable $v is not set, so this build compiles branches production never takes. Add it under Settings > Secrets and variables > Actions > Variables (it is public, not a secret)."
            fi
          done

      - name: Build
        run: npm run build

  # A15 and A16 (30 September 2026): the front door, measured on a production
  # build. The build is started with `next start` and walked by three scripts:
  #   - the weight budget (`scripts/check-weight.mjs`): transferred KB per
  #     public route at 390; a null budget prints the measured weight and never
  #     fails, so the first green run is where budgets are recorded from;
  #   - the landing height ratchet (`scripts/check-landing-height.mjs`),
  #     against `perf-budget.json` "heights" (UIUX item 9 targets beside it);
  #   - the accessibility gate (`tests/a11y-front-door.spec.mjs`): axe over
  #     every public front-door page in en, ha, yo and ig, dark and light, at
  #     390 and 1440, motion off. Serious or critical findings fail the job.
  front-door:
    name: Front door speed and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://uccixoonmbhrnyczyigt.supabase.co' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.vallospaces.com' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_MAPTILER_KEY: ${{ vars.NEXT_PUBLIC_MAPTILER_KEY }}
      BASE_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Browser
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build --workspace @vallo/web

      - name: Start the production server
        working-directory: apps/web
        run: |
          npx next start -p 3210 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3210/ && exit 0
            sleep 2
          done
          cat next-start.log
          exit 1

      - name: Weight budget (public routes)
        working-directory: apps/web
        run: node scripts/check-weight.mjs

      - name: Landing height ratchet
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node scripts/check-landing-height.mjs

      - name: Accessibility gate (axe, four locales)
        if: ${{ !cancelled() }}
        working-directory: apps/web
        run: node tests/a11y-front-door.spec.mjs

  # C16 (30 September 2026): the three desks (host, agent, admin console),
  # measured through the preview harness on a THROWAWAY production server
  # started with VALLO_PREVIEW_HARNESS=1 (never set on Vercel; the harness is
  # 404 everywhere else, lib/preview-harness.ts). The console's security key
  # and the passcode stop a headless browser at the real desks, which is why
  # the harness is the door. Serious or critical axe findings, a confirm panel
  # that loses focus, or a sidebar the keyboard cannot walk fail the job.
  # `host.spec.mjs` then walks every host route signed out (and signed in when
  # the QA secrets exist).
  desks-a11y:
    name: Desks accessibility (host, agent, console)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://uccixoonmbhrnyczyigt.supabase.co' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.vallospaces.com' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      BASE_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Browser
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build --workspace @vallo/web

      - name: Start a throwaway server with the preview harness open
        working-directory: apps/web
        env:
          VALLO_PREVIEW_HARNESS: "1"
        run: |
          npx next start -p 3210 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3210/ && exit 0
            sleep 2
          done
          cat next-start.log
          exit 1

      # The two QA variables are passed here for the same reason `host.spec.mjs`
      # below gets them: with them the spec scans the REAL host and agent desks,
      # and without them it scans only the fixture harness and says so. They are
      # not set today, so this job currently measures the harness; the spec's
      # verdict line states that outright rather than printing a bare pass.
      - name: Desks accessibility (axe, focus, keyboard)
        working-directory: apps/web
        env:
          QA_MEMBER_EMAIL: ${{ secrets.QA_MEMBER_EMAIL }}
          QA_MEMBER_PASSWORD: ${{ secrets.QA_MEMBER_PASSWORD }}
        run: node tests/a11y-desks.spec.mjs

      - name: Host routes answer
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          QA_MEMBER_EMAIL: ${{ secrets.QA_MEMBER_EMAIL }}
          QA_MEMBER_PASSWORD: ${{ secrets.QA_MEMBER_PASSWORD }}
        run: node tests/host.spec.mjs

  # DOC-03. Every supabase/tests/probes/*.sql against the database named by the
  # PROBES_DATABASE_URL secret; each probe must raise PROBE_OK and always rolls
  # back (supabase/tests/README.md). Without the secret this job FAILS, saying
  # that the database was not checked: it can never pass without running.
  db-probes:
    name: Database probes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PER REF, NOT GLOBAL. D47: the group used to be the bare string
    # `db-probes`, shared by every open pull request and every push. The
    # intent was sound ("one run at a time against the database, never
    # cancelled halfway: every probe rolls back, but a killed client leaves its
    # locks to time out") and `cancel-in-progress: false` does protect a run
    # that is already executing. What it does NOT do is hold a queue: GitHub
    # keeps only the most recent PENDING run in a group and cancels the rest.
    # With four pull requests open, the middle ones were evicted.
    #
    # It did exactly that to PR 84, the one branch carrying this round's
    # migrations and money changes: its probe run concluded `cancelled` after
    # NINE SECONDS, against the 92 to 95 seconds a real run takes, with no
    # successful companion. So the database was never checked on that PR, and
    # the check did not read red while that was true. `cancelled` is not a
    # pass, and it is not a failure either, which is how it hid.
    #
    # Keying on the ref means a push only ever evicts its own superseded run,
    # which is correct. THE COST, STATED BECAUSE IT IS A JUDGEMENT ABOUT
    # PRODUCTION AND NOT A TIDY-UP: there is no staging database, so several
    # branches can now run the whole suite against the PRODUCTION database at
    # the same time.
    #
    # CORRECTED 6 OCTOBER, AFTER THE SECOND REVIEW D5 REQUIRES. This comment
    # used to say the cost was acceptable because "every probe runs in a
    # transaction and rolls back, so none of them writes". THAT WAS FALSE.
    # PROBES WRITE CONSTANTLY. What they never do is COMMIT, and the difference
    # is the whole argument: a false premise that happens to reach the right
    # conclusion would wave through a future probe that genuinely does leak.
    #
    # The justification that actually holds, and it is enforced rather than
    # hoped for. `scripts/db-probes/contract.mjs` refuses any probe that is not
    # exactly one `do $$ ... $$` block, that does not `raise exception
    # 'PROBE_OK <its own id>'`, that has no PROBE_FAIL branch, that calls
    # `dblink` or `pg_net` directly, or that contains `COMMIT` at all ("a probe
    # must never be able to keep what it did"). `run.mjs` then wraps every file
    # in `begin; ... rollback;`. That shape check is itself a required gate, run
    # by `run.mjs --check` in the `checks` job above.
    #
    # So no probe can commit, and under READ COMMITTED one branch's fixtures
    # are invisible to another branch for their whole life and are then thrown
    # away. THE ONLY CROSS-BRANCH COUPLING IS LOCK WAITS on rows keyed by a
    # constant, and a lock wait fails loudly: `set local lock_timeout` makes it
    # an explicit red naming a timeout. The status quo produced a nine-second
    # `cancelled` that read as neither pass nor fail. A loud, retryable,
    # correctly-attributed failure strictly dominates a silent gap.
    #
    # Postgres, not this workflow, is the right thing to arbitrate concurrent
    # transactions. The known contention points, and the follow-ups that would
    # remove them, are recorded in docs/sessions/SESSION-4-RESPONSE.md; they are
    # not this trigger's problem to solve.
    #
    # `cancel-in-progress` stays false: a probe killed mid-transaction leaves
    # its locks to time out, and that reason was always correct.
    #
    # ONE THING THIS CANNOT FIX FROM INSIDE THE WORKFLOW: making a `cancelled`
    # run block a merge. A conclusion of `cancelled` is not `success`, so it
    # satisfies nothing in branch protection, but it only actually blocks if
    # this check is in the REQUIRED list for `main`. That is a repository
    # setting (Settings, Branches, branch protection) and the founder's to make.
    concurrency:
      group: db-probes-${{ github.ref }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.PROBES_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: No database configured
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::warning title=DATABASE PROBES DID NOT RUN::The PROBES_DATABASE_URL secret is not set, so no RLS policy, grant or trigger was checked on this push. See supabase/tests/README.md for the one-step setup."
          {
            echo "## Database probes did NOT run"
            echo ""
            echo "PROBES_DATABASE_URL is not set. Nothing in supabase/tests/probes was checked, and this run says nothing about the database."
          } >> "$GITHUB_STEP_SUMMARY"
          # Red, not green-with-a-warning: a job that passes without running
          # is the blind light this job exists to remove, and must never be
          # able to satisfy a required check.
          exit 1

      - name: Install psql
        if: ${{ env.DATABASE_URL != '' }}
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Run every probe
        if: ${{ env.DATABASE_URL != '' }}
        run: node scripts/db-probes/run.mjs --json db-probes.json

      - name: Keep the verdicts
        if: ${{ !cancelled() && env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: db-probes
          path: db-probes.json
          if-no-files-found: ignore
